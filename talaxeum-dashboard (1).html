<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Talaxeum – Dashboard Kartu Tiket</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f5f2;--card:#fff;--tx:#1b1b1f;--mu:#6b6b76;--bd:#e3e1db;--ac:#5b3df5;--ok:#168a4a;--bad:#c4302b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#14141a;--card:#1d1d26;--tx:#eeeef3;--mu:#9a9aa8;--bd:#2c2c38;--ac:#8f7bff;--ok:#4cc27f;--bad:#ff6b66}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#14141a;--card:#1d1d26;--tx:#eeeef3;--mu:#9a9aa8;--bd:#2c2c38;--ac:#8f7bff;--ok:#4cc27f;--bad:#ff6b66}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}h1 span{color:var(--ac)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.sub{color:var(--mu);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px}
.box b{display:block;font-size:24px}.box small{color:var(--mu)}
.scan{display:flex;gap:8px;margin-bottom:6px}
input,select,button{font:inherit;color:var(--tx)}
input{flex:1;min-width:0;padding:11px 12px;border:2px solid var(--ac);border-radius:10px;background:var(--card);text-transform:uppercase}
button{padding:10px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);cursor:pointer}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
#msg{min-height:22px;font-weight:600;margin-bottom:10px}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
.tw{overflow-x:auto;max-height:560px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{position:sticky;top:0;background:var(--card);color:var(--mu);font-weight:600}
tr.r{cursor:pointer}tr.r:hover,tr.sel{background:color-mix(in srgb,var(--ac) 10%,transparent)}
code{font-family:ui-monospace,Menlo,Consolas,monospace}
.pill{padding:2px 8px;border-radius:99px;font-size:12px;background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.pill.b{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.bc{background:#fff;border-radius:8px;padding:10px;text-align:center;color:#000}
.bc svg{width:170px;height:170px;max-width:100%;display:block;margin:0 auto 6px}
ul{list-style:none;margin:8px 0 0;padding:0}li{padding:7px 0;border-bottom:1px solid var(--bd);font-size:14px;display:flex;justify-content:space-between;gap:8px}
#cam{display:none;margin-bottom:10px}.sc #cam{display:block}.sc .stats,.sc .grid{display:none}.sc #msg{font-size:20px}
#sv{width:100%;max-height:320px;background:#000;border-radius:12px;margin-bottom:8px;object-fit:cover}
#sheet{display:none}
@media print{
 .app{display:none}#sheet{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0}
 .c{border:1px solid #000;border-radius:6px;padding:8px;text-align:center;break-inside:avoid;color:#000;background:#fff;font:12px system-ui}
 .c svg{width:130px;height:130px}
}
</style>
</head>
<body>
<div class="app">
 <div class="top">
  <div><h1><span>Talaxeum</span> · Kartu Tiket VIP</h1><div class="sub">Playlist Rewind Bandung · antrian khusus pemegang kartu</div></div>
  <div><button id="nv">Mode Scanner</button> <button id="print">Cetak 100 barcode</button></div>
 </div>
 <div class="stats">
  <div class="box"><b id="s1">0</b><small>Total kartu</small></div>
  <div class="box"><b id="s2">0</b><small>Sudah dipakai</small></div>
  <div class="box"><b id="s3">0</b><small>Total scan</small></div>
  <div class="box"><b id="s4">0</b><small>Diblokir</small></div>
 </div>
 <div id="cam"><video id="sv" playsinline muted></video><button class="p" id="cb">Nyalakan kamera</button></div>
 <div class="scan">
  <input id="in" placeholder="Scan / ketik kode kartu, lalu Enter" autocomplete="off" autofocus>
  <button class="p" id="go">Catat masuk</button>
 </div>
 <div id="msg"></div>
 <div class="grid">
  <div class="box"><div class="sub" style="margin-bottom:6px">Daftar kartu (klik untuk detail)</div>
   <input id="q" placeholder="Cari kode / nomor…" style="border-width:1px;border-color:var(--bd);margin-bottom:8px;width:100%;flex:none">
   <div class="tw"><table><thead><tr><th>No</th><th>Kode</th><th>Status</th><th>Dipakai</th><th>Terakhir</th></tr></thead><tbody id="tb"></tbody></table></div></div>
  <div>
   <div class="box" id="det"><div class="sub">Pilih kartu untuk melihat barcode &amp; riwayat pemakaian.</div></div>
   <div class="box" style="margin-top:14px"><div class="sub">Aktivitas terbaru</div><ul id="rec"></ul></div>
  </div>
 </div>
</div>
<div id="sheet"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
// ---- QR Code (kotak) ----
var P="212222 222122 222221 121223 121322 131222 122213 122312 132212 221213 221312 231212 112232 122132 122231 113222 123122 123221 223211 221132 221231 213212 223112 312131 311222 321122 321221 312212 322112 322211 212123 212321 232121 111323 131123 131321 112313 132113 132311 211313 231113 231311 112133 112331 132131 113123 113321 133121 313121 211331 231131 213113 213311 213131 311123 311321 331121 312113 312311 332111 314111 221411 431111 111224 111422 121124 121421 141122 141221 112214 112412 122114 122411 142112 142211 241211 221114 413111 241112 134111 111242 121142 121241 114212 124112 124211 411212 421112 421211 212141 214121 412121 111143 111341 131141 114113 114311 411113 411311 113141 114131 311141 411131 211412 211214 211232 2331112".split(" ");
function bars(t){var q=qrcode(0,"M");q.addData(t);q.make();var n=q.getModuleCount(),m=3,o="",r,c;
 for(r=0;r<n;r++)for(c=0;c<n;c++)if(q.isDark(r,c))o+='<rect x="'+(c+m)+'" y="'+(r+m)+'" width="1.02" height="1.02"/>';
 return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+(n+2*m)+' '+(n+2*m)+'" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><g fill="#000">'+o+'</g></svg>'}
// ---- 100 kode unik (seed tetap = selalu sama) ----
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var AL="ABCDEFGHJKMNPQRSTUVWXYZ23456789",r=rng(20261104),seen={},cards=[];
while(cards.length<100){var s="";for(var j=0;j<6;j++)s+=AL[Math.floor(r()*AL.length)];if(seen[s])continue;seen[s]=1;var n=cards.length+1;cards.push({n:n,code:"TLX-"+String(n).padStart(3,"0")+"-"+s})}
// ---- state ----
// data dibagi ke semua admin lewat database artifact (fallback lokal jika tidak tersedia)
var st={log:[],blocked:{}},scansC=null,blkC=null;
(async function(){try{var db=window.claude&&await claude.use("db");if(!db)return;scansC=db.collection("scans");blkC=db.collection("blocked");
 scansC.onSnapshot(function(s){st.log=s.docs.map(function(d){return d.data()}).sort(function(a,b){return a.t-b.t});render()});
 blkC.onSnapshot(function(s){st.blocked={};s.docs.forEach(function(d){if(d.data().v)st.blocked[d.id]=true});render()})}catch(e){}})();
function rec(code){var o={code:code,t:Date.now()};if(scansC)scansC.doc(o.t+"-"+Math.random().toString(36).slice(2,6)).set(o).catch(function(){msg("✕ Gagal menyimpan ke database",0)});else st.log.push(o)}
function setBlk(code,v){if(blkC)blkC.doc(code).set({v:v}).catch(function(){});else st.blocked[code]=v}
var $=function(i){return document.getElementById(i)},sel=null;
function fm(t){return new Date(t).toLocaleString("id-ID",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit",second:"2-digit"})}
function uses(c){return st.log.filter(function(l){return l.code==c})}
function render(){
 var q=$("q").value.trim().toUpperCase(),h="",used=0,bl=0;
 cards.forEach(function(c){var u=uses(c.code),b=st.blocked[c.code];if(u.length)used++;if(b)bl++;
  if(q&&c.code.indexOf(q)<0&&String(c.n)!=q)return;
  h+='<tr class="r'+(sel==c.code?" sel":"")+'" data-c="'+c.code+'"><td>'+c.n+'</td><td><code>'+c.code+'</code></td><td><span class="pill'+(b?" b":"")+'">'+(b?"Diblokir":"Aktif")+'</span></td><td>'+u.length+'×</td><td>'+(u.length?fm(u[u.length-1].t):"–")+'</td></tr>'});
 $("tb").innerHTML=h;$("s1").textContent=100;$("s2").textContent=used;$("s3").textContent=st.log.length;$("s4").textContent=bl;
 $("rec").innerHTML=st.log.slice(-8).reverse().map(function(l){return'<li><code>'+l.code+'</code><span class="sub">'+fm(l.t)+'</span></li>'}).join("")||'<li class="sub">Belum ada aktivitas.</li>';
 detail()}
function detail(){
 if(!sel)return;var c=cards.filter(function(x){return x.code==sel})[0],u=uses(sel),b=st.blocked[sel];
 $("det").innerHTML='<div style="display:flex;justify-content:space-between;align-items:center"><b>Kartu #'+c.n+'</b><span class="pill'+(b?" b":"")+'">'+(b?"Diblokir":"Aktif")+'</span></div><div class="bc" style="margin:10px 0">'+bars(c.code)+'<code>'+c.code+'</code></div><button id="blk">'+(b?"Aktifkan kembali":"Blokir kartu")+'</button><div class="sub" style="margin-top:12px">Riwayat pemakaian ('+u.length+')</div><ul>'+(u.slice().reverse().map(function(l,i){return'<li><span>Masuk antrian #'+(u.length-i)+'</span><span class="sub">'+fm(l.t)+'</span></li>'}).join("")||'<li class="sub">Belum pernah dipakai.</li>')+'</ul>';
 $("blk").onclick=function(){setBlk(sel,!st.blocked[sel]);render()}}
function msg(t,ok){$("msg").className=ok?"ok":"bad";$("msg").textContent=t}
function scan(){var v=$("in").value.trim().toUpperCase();$("in").value="";if(!v)return;
 var c=cards.filter(function(x){return x.code==v})[0];
 if(!c){msg("✕ Kode "+v+" tidak terdaftar",0);return}
 sel=c.code;
 if(st.blocked[c.code]){msg("✕ Kartu #"+c.n+" diblokir",0);render();return}
 var prev=uses(c.code).length;rec(c.code);
 msg("✓ Kartu #"+c.n+" valid – "+(prev?"pemakaian ke-"+(prev+1):"pemakaian pertama"),1);render()}
$("in").addEventListener("keydown",function(e){if(e.key=="Enter")scan()});
$("go").onclick=scan;$("q").oninput=render;
$("tb").onclick=function(e){var t=e.target.closest("tr");if(t){sel=t.dataset.c;render()}};
$("print").onclick=function(){$("sheet").innerHTML=cards.map(function(c){return'<div class="c"><div>Talaxeum · #'+c.n+'</div>'+bars(c.code)+'<div><code>'+c.code+'</code></div></div>'}).join("");window.print()};
// ---- scanner kamera (ZXing, dimuat saat kamera dinyalakan) ----
var cam=null,last="",lastT=0;
function onCode(v){var n=Date.now();if(v==last&&n-lastT<3000)return;last=v;lastT=n;$("in").value=v;scan();if(navigator.vibrate)navigator.vibrate(80)}
async function startCam(){try{
 if(!window.ZXing)await new Promise(function(ok,no){var s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js";s.onload=ok;s.onerror=no;document.head.appendChild(s)});
 var rd=new ZXing.BrowserMultiFormatReader();cam={stop:function(){rd.reset()}};
 await rd.decodeFromVideoDevice(null,"sv",function(r){if(r)onCode(r.getText())});
 $("cb").textContent="Matikan kamera";msg("Arahkan barcode ke kamera…",1)}
 catch(e){cam=null;msg("✕ Kamera tidak bisa dibuka ("+(e.name||"error")+"). Pakai input manual atau scanner USB.",0)}}
function stopCam(){if(cam){cam.stop();cam=null}$("cb").textContent="Nyalakan kamera"}
$("cb").onclick=function(){cam?stopCam():startCam()};
function mode(){var s=location.hash=="#scan";document.body.classList.toggle("sc",s);$("nv").textContent=s?"Mode Dashboard":"Mode Scanner";if(!s)stopCam()}
$("nv").onclick=function(){location.hash=location.hash=="#scan"?"":"scan"};window.onhashchange=mode;mode();
render();
</script>
</body>
</html>
